[package]
name = "seekvo-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The file index and search engine behind Seekvo"
repository = "https://github.com/Shahryartariq/seekvo"
publish = false

[dependencies]
memchr = "2"

[lints.rust]
# Set by hand to type-check the Windows-only code on another system.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seekvo_check_windows)'] }

# The Windows test reads a real drive with over a million files. Optimised
# test builds keep that to a few seconds.
[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
