name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      # The version matches engine/rust-toolchain.toml.
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Hosted Windows runners are administrators, so this reads a real
      # NTFS drive, with each reader, twice. It runs before the tests so the
      # first reads are of a drive nothing has warmed up. Each result line
      # is kept as a notice on the run.
      - if: runner.os == 'Windows'
        name: Index the runner's system drive
        shell: bash
        run: |
          cargo build --release --quiet
          index_drive() {
            out=$(./target/release/seekvo-engine drive C system32 --limit 5 --reader "$1")
            echo "$out"
            echo "::notice title=$2::$(echo "$out" | head -n 1)"
          }
          index_drive table "File table first read"
          index_drive records "Records from Windows first read"
          index_drive table "File table read again"
          index_drive records "Records from Windows read again"
      # Index the drive, keep watching it, and meanwhile create, rename and
      # delete a file. The watcher repeats its search after every change it
      # sees, so its output shows the file appear, change name and go.
      - if: runner.os == 'Windows'
        name: Follow changes on the runner's system drive
        shell: bash
        run: |
          out="$RUNNER_TEMP/watch.txt"
          ./target/release/seekvo-engine watch C seekvo-watch-demo --path --limit 5 --seconds 20 > "$out" 2>&1 &
          watcher=$!
          for _ in $(seq 1 180); do
            grep -q "^Watching" "$out" && break
            kill -0 "$watcher" 2>/dev/null || break
            sleep 1
          done
          demo="$(cygpath -u "$USERPROFILE")/seekvo-watch-demo"
          mkdir -p "$demo"
          echo hello > "$demo/first.txt"
          sleep 4
          mv "$demo/first.txt" "$demo/renamed.txt"
          sleep 4
          rm -r "$demo"
          status=0
          wait "$watcher" || status=$?
          cat "$out"
          echo "::notice title=Following changes start::$(head -n 1 "$out")"
          grep -m 4 " changed: " "$out" | while read -r line; do
            echo "::notice title=Following changes::$line"
          done
          # The file must have been seen under both names, and seen to go.
          grep -q 'seekvo-watch-demo\\first.txt' "$out"
          grep -q 'seekvo-watch-demo\\renamed.txt' "$out"
          tail -n 3 "$out" | grep -q "^0 matches"
          exit "$status"
      - run: cargo test
