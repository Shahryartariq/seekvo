name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      # The version matches engine/rust-toolchain.toml.
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Hosted Windows runners are administrators, so this reads a real
      # NTFS drive, with each reader, twice. It runs before the tests so the
      # first reads are of a drive nothing has warmed up. Each result line
      # is kept as a notice on the run.
      - if: runner.os == 'Windows'
        name: Index the runner's system drive
        shell: bash
        run: |
          cargo build --release --quiet
          index_drive() {
            out=$(./target/release/seekvo-engine drive C system32 --limit 5 --reader "$1")
            echo "$out"
            echo "::notice title=$2::$(echo "$out" | head -n 1)"
          }
          index_drive table "File table first read"
          index_drive records "Records from Windows first read"
          index_drive table "File table read again"
          index_drive records "Records from Windows read again"
      - run: cargo test
